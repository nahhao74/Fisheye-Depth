[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nadir-fisheye-depth"
version = "0.1.0"
description = "NADIR: native-fisheye multi-view metric depth research core"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "psutil>=5.9",
]
mvs-gi = [
  "opencv-python-headless>=4.8",
]

[tool.setuptools.packages.find]
include = ["nadir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
